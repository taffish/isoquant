[package]
name = "isoquant"
kind = "tool"
version = "4.0.0"
release = 2
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/isoquant"

[command]
name = "taf-isoquant"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/isoquant:4.0.0-r2"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["transcriptomics", "long-read", "isoform-discovery", "quantification", "single-cell"]
keywords = ["isoquant", "long-read-rna-seq", "nanopore", "pacbio", "isoform", "transcript-discovery", "transcript-quantification", "single-cell", "spatial-transcriptomics", "fusion"]
description = "Transcript discovery, quantification, barcode processing, and visualization for long-read RNA sequencing."

[upstream]
name = "IsoQuant"
type = "github"
repo = "ablab/IsoQuant"
homepage = "https://ablab.github.io/IsoQuant/"
release_url = "https://github.com/ablab/IsoQuant/releases/tag/v4.0.0"
downloads = "https://github.com/ablab/IsoQuant/releases/download/v4.0.0/IsoQuant-4.0.0.tar.gz"
version = "4.0.0"
commit = "7d8268918a770b8d0c6925e8cea99d6c969b4eae"
license = "GPL-2.0-only"
citation = "Prjibelski AD, Mikheenko A, Joglekar A, et al. Accurate isoform discovery with IsoQuant using long reads. Nature Biotechnology. 2023;41:915-918."
doi = "10.1038/s41587-022-01565-y"
pmid = "36593406"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["isoquant", "isoquant-detect-barcodes", "isoquant-visualize", "python", "python3", "minimap2", "samtools", "STAR", "STARlong", "gzip", "zcat", "find", "grep", "sed", "tail", "sh"]
test = ["/opt/isoquant/share/testdata/isoquant-smoke.sh identity", "/opt/isoquant/share/testdata/isoquant-smoke.sh modules", "/opt/isoquant/share/testdata/isoquant-smoke.sh pipeline"]
